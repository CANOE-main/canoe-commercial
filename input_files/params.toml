# Configuration for canoe-commercial aggregation
schema_version = "4.0"
version = "001"
sector_abv = "COM"
sector_longname = "commercial"
data_id_prefix = "COMHR"
data_version = "001"
db_dir = "."
sqlite_database = "canoe.sqlite"
excel_template = "Template spreadsheet (make a copy).xlsx"
excel_output = "commercial.xlsx"

future_periods = [2025, 2030, 2035, 2040, 2045, 2050]
province_list = ["ON", "AB", "BC", "QC", "MB", "SK", "NLLAB", "PEI", "NS", "NB"]

base_year = 2022
period_step = 5
timezone = "EST"
weather_year = 2018

# Runtime switches
force_generate_weather_maps = false
force_download = false
show_plots = true
clone_to_xlsx = false
include_dsd = true
include_emissions = false
validation_behavior = "error"

# Filter out secondary energy consumption below this fraction of total
sec_tolerance = 0.05

# Other demand electrification: fraction of non-electric fuel switched to electricity by final period
other_electrification_factor = 0.62
cef_note = "Assumed that 62% of non-electric fuel consumption is 1:1 switched for electricity by 2050, changing linearly (CER, 2023)"
cef_reference = "CER. (2023). Canadas Energy Future Data Appendices [dataset]. https://doi.org/10.35002/ZJR8-8X75"

# GDP projections
gdp_url = "https://www.cer-rec.gc.ca/open/energy/energyfutures2023/macro-indicators-2023.csv"
gdp_scenario = "Global Net-zero"
gdp_variable = "Real Gross Domestic Product ($2012 Millions)"
gdp_data_year = 2023
gdp_reference = "CER (2023). Canadas Energy Future 2023: Energy Supply and Demand Projections to 2050 - macro-indicators-2023. https://open.canada.ca/data/en/dataset/5a6abd9d-d343-41ef-a525-7a1efb686300/resource/ac214892-e9d1-46c1-a6f9-c2130c5e9b51"

# Population projections
population_m_scenario = "Projection scenario M1: medium-growth"
pop_reference = "Statistics Canada, (2025, January 21). Projected population, by projection scenario, age and gender, as of July 1. https://www150.statcan.gc.ca/t1/tbl1/en/cv.action?pid=1710005701"

# AEO commercial demand module
aeo_installed_year = 2012
aeo_reference = "EIA. (2023, July). Download the National Energy Modeling System (NEMS). AEO2023_Reference_case_CDM_technology_menu_ktekx [dataset]. https://www.eia.gov/outlooks/aeo/info_nems_archive.php"
aeo_currency_year = 2022
aeo_currency = "USD"

# NRCan Comprehensive Energy Use Database
nrcan_url = "https://oee.nrcan.gc.ca/corporate/statistics/neud/dpa/data_e/downloads/comprehensive/Excel/<y>/com_<r>_e_<t>.xls"
nrcan_reference = "Natural Resources Canada, (2020). Comprehensive Energy Use Database. https://oee.nrcan.gc.ca/corporate/statistics/neud/dpa/menus/trends/comprehensive_tables/list.cfm"

# EPA emission factors
epa_year = 2025
epa_url = "https://www.epa.gov/system/files/other-files/2025-01/ghg-emission-factors-hub-2025.xlsx"
epa_reference = "US EPA. (2025, January). GHG Emission Factors Hub [Overviews and Factsheets]. https://www.epa.gov/climateleadership/ghg-emission-factors-hub"
emission_commodity = "co2e"
emission_activity_units = "ktCO2e/PJ"

# Currency
final_currency = "CAD"
final_currency_year = 2020
inflation_index = "gdp_deflator"

[comstock]
url = "https://oedi-data-lake.s3.amazonaws.com/nrel-pds-building-stock/end-use-load-profiles-for-us-building-stock/2024/comstock_amy2018_release_2/timeseries_aggregates/by_state/upgrade%3D39/state%3D<su>/up39-<sl>-<b>.csv"
data_year = 2024
building_types = [
  "fullservicerestaurant",
  "hospital",
  "largehotel",
  "largeoffice",
  "mediumoffice",
  "outpatient",
  "primaryschool",
  "quickservicerestaurant",
  "retailstandalone",
  "retailstripmall",
  "secondaryschool",
  "smallhotel",
  "smalloffice",
  "warehouse",
]
reference = "NREL. (2024). ComStock-NREL (amy2018, v2, upgrade 39). https://data.openei.org/s3_viewer?bucket=oedi-data-lake"

[weather]
us_temperature_url = "https://www.renewables.ninja/country_downloads/US/ninja-weather-country-US-temperature_pop_wtd-merra2.csv"
us_humidity_url = "https://www.renewables.ninja/country_downloads/US/ninja-weather-country-US-humidity_pop_wtd-merra2.csv"
ca_temperature_url = "https://www.renewables.ninja/country_downloads/CA/ninja-weather-country-CA-temperature_pop_wtd-merra2.csv"
ca_humidity_url = "https://www.renewables.ninja/country_downloads/CA/ninja-weather-country-CA-humidity_pop_wtd-merra2.csv"
reference = "Staffell et al. (2023) https://doi.org/10.1038/s41560-023-01341-5 https://www.renewables.ninja/"

[conversion_factors]

[conversion_factors.epa_units]
CO2 = 0.948      # kg/MMBtu → kt/PJ
CH4 = 0.000948   # g/MMBtu → kt/PJ
N2O = 0.000948   # g/MMBtu → kt/PJ

[conversion_factors.gwp]
CO2 = 1
CH4 = 28
N2O = 265

[conversion_factors.efficiency]
EER = 0.293  # kBtu/kWh → PJ/PJ

[conversion_factors.cost]
aeo = 0.108198  # $/(kBtu/h) → M$/(PJ/y)

